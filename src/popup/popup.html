<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page to Markdown</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup" aria-labelledby="app-title">
      <header class="popup-header">
        <div>
          <p class="eyebrow">PAGE TO MARKDOWN</p>
          <h1 id="app-title">Clean Markdown</h1>
        </div>
        <p id="status" class="status" role="status">Preparing page conversion...</p>
      </header>

      <section class="editor-section" aria-labelledby="editor-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">OUTPUT</p>
            <h2 id="editor-title">Markdown</h2>
          </div>
          <div class="editor-tools">
            <button id="pick-element" class="icon-button" type="button" aria-label="Pick page element" title="Pick page element">⌖</button>
            <button id="expand-editor" class="icon-button" type="button" aria-label="Expand editor" title="Expand editor">⤢</button>
          </div>
        </div>
        <p id="activity-status" class="activity-status" role="status" hidden></p>

        <div class="tabs" role="tablist" aria-label="Output view">
          <button id="edit-tab" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="edit-panel">Edit Markdown</button>
          <button id="preview-tab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="preview-panel">Rendered Preview</button>
        </div>

        <div id="edit-panel" class="tabpanel" role="tabpanel" aria-labelledby="edit-tab">
          <textarea id="markdown" spellcheck="false" aria-label="Editable Markdown output" placeholder="Your converted page will appear here." disabled></textarea>
        </div>
        <article id="preview-panel" class="tabpanel preview-panel" role="tabpanel" aria-labelledby="preview-tab" hidden></article>
      </section>

      <footer class="actions">
        <button id="convert" class="subtle-button" type="button">Convert again</button>
        <button id="copy" class="subtle-button" type="button" disabled>Copy Markdown</button>
        <button id="download" class="primary-button" type="button" disabled>Download .md</button>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
